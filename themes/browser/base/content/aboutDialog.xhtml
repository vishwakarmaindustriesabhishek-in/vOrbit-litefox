<?xml-stylesheet href="chrome://global/skin/global.css" type="text/css"?>
<?xml-stylesheet href="chrome://browser/content/aboutDialog.css" type="text/css"?>

<window xmlns:html="http://www.w3.org/1999/xhtml"
        xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
        id="aboutDialog"
        windowtype="Browser:About"
        onload="init(event);"
#ifdef XP_MACOSX
        inwindowmenu="false"
#else
        data-l10n-id="aboutDialog-title"
#endif
        role="dialog"
        aria-describedby="version aboutText companyBrand"
        >
#ifdef XP_MACOSX
#include macWindow.inc.xhtml
#else
  <script src="chrome://browser/content/utilityOverlay.js"/>
#endif

  <linkset>
    <html:link rel="localization" href="branding/brand.ftl"/>
    <html:link rel="localization" href="browser/aboutDialog.ftl"/>
  </linkset>

  <script src="chrome://browser/content/aboutDialog.js"/>

  <div id="grid">
    <div id="left" />
    <div id="right">
      <html:img id="wordmark" src="chrome://branding/content/about-wordmark.svg"
                alt="vOrbit-lite" width="200" height="56" />
      <div id="version">
        <label id="versionNumber" />
      </div >
      <label id="distribution" />
      <label id="distributionId" />
      <label id="aboutText" data-l10n-id="about-vorbit" />
      <div id="companyBrand">
        <html:img src="chrome://branding/content/rs-foundation.png" alt=""
                  width="40" height="40" />
        <label data-l10n-id="vorbit-brand-vendor" />
      </div>
      <label id="websiteLink" is="text-link" href="https://vorbit.net/">https://vorbit.net/</label>
    </div>
  </div>

  <keyset>
    <key keycode="VK_ESCAPE" oncommand="window.close();"/>
  </keyset>

</window>
